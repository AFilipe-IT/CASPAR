# test_target/httpd_hardened.conf
# Fixture CORRETAMENTE configurada para o target 'apache-httpd' — as
# diretivas cobertas pela suite de recall (httpd.conf) em valores seguros.
# Qualquer finding aqui é um falso positivo (precisão/F1).

ServerRoot "/usr/local/apache2"
Listen 80
Listen 443

User www-data
Group www-data
ServerSignature Off
TraceEnable Off
Timeout 10
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 100
LogLevel warn
FileETag None
LimitRequestLine 8190
LimitRequestFields 100
LimitRequestFieldSize 8190
LimitRequestBody 1048576
SSLCompression Off

ServerTokens Prod

<Directory "/srv/www">
    Options None
    AllowOverride None
    Order Deny,Allow
</Directory>

SSLProtocol TLSv1.2 TLSv1.3
Header always set Strict-Transport-Security "max-age=63072000"
Header always set Content-Security-Policy "default-src 'self'"
Header always set Referrer-Policy "no-referrer"
Header always set Permissions-Policy "geolocation=()"
