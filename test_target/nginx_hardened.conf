# test_target/nginx_hardened.conf
# Fixture CORRETAMENTE configurada para o target 'nginx' — todas as
# diretivas cobertas pela suite de recall (nginx.conf) em valores seguros.
# Qualquer finding aqui é um falso positivo (métrica de precisão/F1).

http {
    server_tokens off;
    send_timeout 30;
    client_max_body_size 1m;

    server {
        listen 80;
        keepalive_timeout 15;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        location /backend {
            proxy_pass https://backend.internal:8443;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/trusted.crt;
            proxy_ssl_name backend.internal;
        }
    }

    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/ssl.crt;
        ssl_certificate_key /etc/nginx/ssl.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets on;
        ssl_stapling on;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
