# test_target/redis_demo/redis_hardened.conf
# Fixture CORRETAMENTE configurada para o target 'redis' — as diretivas
# cobertas pela suite de recall (redis_demo/redis.conf) em valores seguros.
# Qualquer finding aqui é um falso positivo (precisão/F1).

tls_version >= v1.2
max_connections 1000
disabled_commands FLUSHALL,FLUSHDB,CONFIG
chown redis:redis
permissions 700
alert_threshold_storage less than 90%
directory_permissions 750
user_role admin
default_database_access disabled
cm_session_timeout_minutes 5
lua_scripts_enabled false
