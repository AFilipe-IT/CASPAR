# test_target/sysctl_vulnerable.conf
# Kernel/network sysctl settings DELIBERADAMENTE inseguros — fixture de demo.
# Cada linha viola um controlo config-based do CIS Ubuntu 22.04 L1 que o target
# 'ubuntu' cobre. Correr:  sca scan test_target/sysctl_vulnerable.conf

net.ipv4.conf.all.accept_redirects       = 1    # deve ser 0 (ICMP redirects)
net.ipv4.conf.all.accept_source_route    = 1    # deve ser 0 (source routing)
net.ipv4.conf.all.rp_filter              = 0    # deve ser 1 (reverse-path filter)
net.ipv4.conf.all.send_redirects         = 1    # deve ser 0
net.ipv4.tcp_syncookies                  = 0    # deve ser 1 (SYN flood)
net.ipv4.icmp_echo_ignore_broadcasts     = 0    # deve ser 1 (Smurf)
net.ipv4.ip_forward                      = 1    # deve ser 0 (não é router)
kernel.randomize_va_space                = 0    # deve ser 2 (ASLR)
fs.suid_dumpable                         = 1    # deve ser 0 (core de setuid)
