[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caspar"
version = "0.1.0"
description = "CASPAR — Configuration Vulnerability Meter (CVM) reference implementation, CCSS-based (NISTIR 7502)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "click>=8.1",
    "pyyaml>=6.0",   # IaC: Kubernetes manifest parsing (yaml_flat)
    # Phase 2+ dependencies (uncomment when needed):
    # "llama-index>=0.10",
    # "anthropic>=0.25",
    # "openpyxl>=3.1",
    # "pyparsing>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # The API test modules import fastapi.testclient at module level, so the
    # suite cannot even be collected without these. Keeping them out of [dev]
    # made `pip install -e ".[dev]" && pytest` fail on a clean machine.
    "fastapi>=0.110",
    "httpx>=0.27",              # required by fastapi.testclient
    "python-multipart>=0.0.9",  # UploadFile/Form support (POST /scans/upload)
]
publish = [
    "requests>=2.31",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",  # UploadFile/Form support (POST /scans/upload)
]

[project.scripts]
caspar = "cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so 'from config_assessment.xxx import' works without install
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["config_assessment", "cli"]
